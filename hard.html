<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쌰갈 스도쿠 (Hard)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
        h1 { color: #333; margin-bottom: 5px; }
        .step { color: #6c757d; font-size: 15px; margin-bottom: 10px; }
        .who { font-size: 16px; font-weight: bold; color: #e83e8c; margin-bottom: 15px; }
        .tip { font-size: 14px; color: #856404; background-color: #fff3cd; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; max-width: 420px; text-align: center; line-height: 1.6; }

        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .controls button { padding: 10px 20px; font-size: 16px; border: none; background-color: #6c757d; color: white; border-radius: 5px; cursor: pointer; }
        .controls button.submit { background-color: #28a745; }
        .controls button:disabled { background-color: #adb5bd; cursor: not-allowed; }

        .sudoku-board { display: grid; grid-template-columns: repeat(9, 42px); grid-template-rows: repeat(9, 42px); border: 3px solid #000; margin-bottom: 20px; }
        .cell { width: 42px; height: 42px; background-color: white; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; cursor: pointer; user-select: none; box-sizing: border-box; position: relative; border-right: 1px solid #000; border-bottom: 1px solid #000; }
        .cell:nth-child(3n):not(:nth-child(9n)) { border-right: 3px solid #000; }
        .cell:nth-child(9n) { border-right: none; }
        .sudoku-board > .cell:nth-child(n+19):nth-child(-n+27), .sudoku-board > .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #000; }
        .sudoku-board > .cell:nth-child(n+73) { border-bottom: none; }

        .color-1 { background-color: #fce4d6; } .color-2 { background-color: #ddebf7; } .color-3 { background-color: #e2efda; } .color-4 { background-color: #f2ceef; } .color-5 { background-color: #cbf3f0; }
        .cage-sum { position: absolute; top: 2px; left: 3px; font-size: 10px; font-weight: normal; color: #333; line-height: 1; }
        .cell.selected { border: 3px solid #ff0000 !important; z-index: 10; }
        .numpad { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; margin-bottom: 20px; }
        .numpad button { width: 70px; height: 50px; font-size: 20px; border: none; background-color: #e83e8c; color: white; border-radius: 8px; cursor: pointer; }
        
        .timer-box {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            background-color: #fff;
            border: 2px solid #a6cfe8;
            border-radius: 8px;
            padding: 8px 16px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🔥 쌰갈 스도쿠</h1>
    <div class="step">난이도: Hard (마지막 단계)</div>
    
    <div class="timer-box">
        ⏱️ 경과 시간: <span id="timer-display">00:00</span>
    </div>

    <div class="who" id="who"></div>
    <div class="tip">
        ⚠️ 이 화면에는 지금까지 푼 모든 기록이 담겨 있습니다.<br>
        제출을 마치기 전에 탭을 닫거나 새로 고침하지 마세요.
    </div>

    <div class="sudoku-board" id="board"></div>

    <div class="numpad">
        <button onclick="inputNumber(1)">1</button>
        <button onclick="inputNumber(2)">2</button>
        <button onclick="inputNumber(3)">3</button>
        <button onclick="inputNumber(4)">4</button>
        <button onclick="inputNumber(5)">5</button>
        <button onclick="inputNumber(6)">6</button>
        <button onclick="inputNumber(7)">7</button>
        <button onclick="inputNumber(8)">8</button>
        <button onclick="inputNumber(9)">9</button>
    </div>

    <div class="controls">
        <button onclick="clearCell()">지우기</button>
        <button onclick="clearAllCells()" style="background-color: #ff3b30; color: white;">전체 지우기</button>
        <button class="submit" id="submit-btn" onclick="submitSudoku()">최종 제출하기</button>
    </div>

    <script>
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdsib-_fNn4k7EUoZa9Q-aSjyCXOok8drNctMvnESmPtg9mVw/formResponse";
        const ENTRY_STUDENT_ID = "entry.739411276";
        const ENTRY_STUDENT_NAME = "entry.2089700400";
        const ENTRY_EASY_ANSWER = "entry.1354150465";
        const ENTRY_EASY_TIME = "entry.264315519";
        const ENTRY_NORMAL_ANSWER = "entry.1040167626";
        const ENTRY_NORMAL_TIME = "entry.1999114906";
        const ENTRY_HARD_ANSWER = "entry.987739919";
        const ENTRY_HARD_TIME = "entry.1607811555";

        const STORAGE_KEY = "sudokuTotalProgress";
        let savedData = null;
        let selectedCellIndex = null;
        let submitted = false;   // 제출 완료 여부

        const cageColors = [
            1, 2, 2, 1, 2, 2, 1, 1, 1,
            1, 3, 3, 1, 2, 2, 3, 2, 1,
            2, 2, 4, 4, 1, 4, 3, 2, 1,
            1, 1, 1, 4, 1, 4, 1, 3, 3,
            2, 2, 2, 2, 2, 2, 1, 1, 3,
            1, 1, 1, 3, 1, 3, 1, 3, 3,
            2, 2, 3, 3, 1, 3, 2, 1, 4,
            1, 4, 4, 1, 5, 5, 2, 1, 4,
            1, 2, 2, 1, 5, 5, 4, 4, 4
        ];
        const cageSums = [
            6, 7, null, 4, 23, null, 32, null, null,
            null, 17, null, null, null, null, 7, 6, null,
            8, null, 14, null, 17, 10, null, null, null,
            12, null, null, null, null, null, 30, 15, null,
            31, null, null, null, null, null, null, null, null,
            18, null, null, 21, 8, 14, null, null, null,
            9, null, null, null, null, null, 7, 10, 28,
            9, 11, null, 12, 11, null, null, null, null,
            null, 8, null, null, null, null, null, null, null
        ];

        function loadSavedData() {
            const saved = sessionStorage.getItem(STORAGE_KEY);
            if (!saved) {
                alert("⚠️ 이전 난이도 진행 기록이 없습니다. 처음부터 다시 진행해 주세요.");
                window.location.href = "index.html";
                return false;
            }
            try {
                savedData = JSON.parse(saved);
            } catch (e) {
                savedData = null;
            }
            if (!savedData || !savedData.studentId) {
                alert("⚠️ 기록을 읽을 수 없습니다. 처음 화면으로 이동합니다.");
                sessionStorage.removeItem(STORAGE_KEY);
                window.location.href = "index.html";
                return false;
            }
            document.getElementById('who').innerText =
                savedData.studentId + " " + savedData.studentName + " 님, 마지막 도전입니다!";
            return true;
        }

        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = "";
            for (let i = 0; i < 81; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if (cageColors[i]) cell.classList.add('color-' + cageColors[i]);
                if (cageSums[i] !== null) {
                    const sumSpan = document.createElement('span');
                    sumSpan.classList.add('cage-sum');
                    sumSpan.innerText = cageSums[i];
                    cell.appendChild(sumSpan);
                }
                const valueSpan = document.createElement('span');
                valueSpan.id = 'val-' + i;
                cell.appendChild(valueSpan);
                cell.addEventListener('click', () => selectCell(i, cell));
                cell.id = 'cell-' + i;
                boardEl.appendChild(cell);
            }
        }

        function selectCell(index, cellEl) {
            if (selectedCellIndex !== null) {
                const prev = document.getElementById('cell-' + selectedCellIndex);
                if (prev) prev.classList.remove('selected');
            }
            selectedCellIndex = index;
            cellEl.classList.add('selected');
        }

        function inputNumber(num) {
            if (selectedCellIndex !== null) {
                document.getElementById('val-' + selectedCellIndex).innerText = num;
            } else {
                alert("먼저 숫자를 입력할 빈칸을 선택해 주세요.");
            }
        }
        
        let timerInterval = null;
        let secondsPassed = 0;

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            secondsPassed = 0;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                secondsPassed++;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(secondsPassed / 60);
            const seconds = secondsPassed % 60;
            const formattedMinutes = String(minutes).padStart(2, '0');
            const formattedSeconds = String(seconds).padStart(2, '0');
            
            const display = document.getElementById('timer-display');
            if (display) display.innerText = `${formattedMinutes}:${formattedSeconds}`;
        }

        function clearCell() {
            if (selectedCellIndex !== null) {
                document.getElementById('val-' + selectedCellIndex).innerText = "";
            }
        }

        function clearAllCells() {
            const check = confirm("작성하신 모든 숫자를 지우고 처음부터 다시 시작하시겠습니까?");
            if (check) {
                for (let i = 0; i < 81; i++) {
                    const valSpan = document.getElementById('val-' + i);
                    if (valSpan) valSpan.innerText = "";
                }
                if (selectedCellIndex !== null) {
                    const prev = document.getElementById('cell-' + selectedCellIndex);
                    if (prev) prev.classList.remove('selected');
                    selectedCellIndex = null;
                }
            }
        }

        window.addEventListener('keydown', function(event) {
            if (document.activeElement.tagName === 'INPUT') return;
            if (event.key === 'Backspace') event.preventDefault();
            if (selectedCellIndex === null) return;

            if (event.key >= '1' && event.key <= '9') {
                inputNumber(event.key);
            } else if (event.key === 'Backspace' || event.key === 'Delete') {
                event.preventDefault();
                clearCell();
            }
        });

        window.addEventListener('beforeunload', function(event) {
            if (submitted) return;
            event.preventDefault();
            event.returnValue = "";
        });

        function submitSudoku() {
            let killerAnswer = "";
            for (let i = 0; i < 81; i++) {
                const cellText = document.getElementById('val-' + i).innerText.trim();
                if (cellText === "") {
                    alert("⚠️ 쌰갈 스도쿠의 모든 칸을 채워야 제출할 수 있습니다!");
                    return;
                }
                killerAnswer += cellText;
            }

            if (timerInterval) clearInterval(timerInterval);
            const hardTimeSpent = document.getElementById('timer-display').innerText;

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "전송 중...";

            const formData = new URLSearchParams();
            formData.append(ENTRY_STUDENT_ID, savedData.studentId);
            formData.append(ENTRY_STUDENT_NAME, savedData.studentName);
            
            if (savedData.easy) formData.append(ENTRY_EASY_ANSWER, savedData.easy);
            if (savedData.easyTime) formData.append(ENTRY_EASY_TIME, savedData.easyTime);

            if (savedData.normal) formData.append(ENTRY_NORMAL_ANSWER, savedData.normal);
            if (savedData.normalTime) formData.append(ENTRY_NORMAL_TIME, savedData.normalTime);

            formData.append(ENTRY_HARD_ANSWER, killerAnswer);
            formData.append(ENTRY_HARD_TIME, hardTimeSpent);

            submitted = true;

            fetch(FORM_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            }).then(() => {
                alert("🎉 모든 난이도의 제출이 완벽하게 완료되었습니다!");
                sessionStorage.removeItem(STORAGE_KEY);
                window.location.href = "thankyou.html";
            }).catch(() => {
                alert("❌ 전송 중 오류가 발생했습니다.");
                btn.disabled = false;
                btn.innerText = "최종 제출하기";
                submitted = false;
            });
        }

        window.onload = function() {
            if (loadSavedData()) {
                initBoard();
                startTimer();
            }
        };
    </script>
</body>
</html>
