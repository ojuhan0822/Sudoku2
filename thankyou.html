<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제출 완료 - 학교 행사 스도쿠 챌린지</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 64px;
            margin-bottom: 15px;
            display: inline-block;
        }
        h1 {
            color: #28a745;
            font-size: 26px;
            margin: 0 0 10px 0;
        }
        .subtitle {
            color: #6c757d;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .message-box {
            background-color: #eef9f1;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            color: #155724;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #e9ecef;
            color: #495057;
        }
        .btn-secondary:hover {
            background-color: #dee2e6;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">🎉</div>
    <h1>수고하셨습니다!</h1>
    <div class="subtitle">학교 행사 스도쿠 챌린지 제출 완료</div>

    <div class="message-box">
        <strong>응답이 성공적으로 제출되었습니다!</strong><br>
        열심히 참여해 주셔서 감사합니다. 메인 화면으로 돌아가거나 창을 닫아주세요.
    </div>

    <div class="btn-group">
        <a href="index.html" class="btn btn-primary">처음 화면으로 돌아가기</a>
    </div>
</div>

</body>
</html>
